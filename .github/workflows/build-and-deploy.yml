name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'melbalabs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: pip install build wheel
      
      - name: Create pyproject.toml
        run: |
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "melbalabs_summarize_consumes"
          authors = [
              {name = "melba"},
          ]
          dynamic = ["version", "dependencies", "optional-dependencies"]

          [project.urls]
          Homepage = "https://github.com/whtmst/summarize_consumes"

          [project.scripts]
          summarize_consumes = "melbalabs.summarize_consumes.main:main"

          [tool.setuptools.packages.find]
          where = ["src"]

          [tool.setuptools.dynamic]
          version = {attr = "melbalabs.summarize_consumes.package.VERSION"}
          dependencies = {file = ["deps/requirements.txt"]}
          EOF
      
      - name: Create package structure
        run: |
          mkdir -p src/melbalabs/summarize_consumes
          mkdir -p deps
          # Копируем все Python файлы
          cp *.py src/melbalabs/summarize_consumes/ 2>/dev/null || true
          cp -r melbalabs/summarize_consumes/* src/melbalabs/summarize_consumes/ 2>/dev/null || true
          # Копируем зависимости
          cp deps/requirements.txt deps/ 2>/dev/null || true
          touch src/melbalabs/__init__.py
          touch src/melbalabs/summarize_consumes/__init__.py
          # ВАЖНО: перезаписываем package.py исправленной версией
          cat > src/melbalabs/summarize_consumes/package.py << 'EOF'
          VERSION = "2025.11.21"
          PROJECT_NAME = "melbalabs_summarize_consumes"
          PROJECT_URL = "Homepage, https://github.com/whtmst/summarize_consumes"
          EOF
      
      - name: Build wheel
        run: python -m build --wheel
      
      - name: Prepare web folder
        run: |
          mkdir -p web
          cp dist/*.whl web/
          echo "2025.11.21" > web/current_version.txt
          # Копируем веб-файлы если их нет
          cp index.html web/ 2>/dev/null || true
          cp style.css web/ 2>/dev/null || true
          cp worker.js web/ 2>/dev/null || true
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
