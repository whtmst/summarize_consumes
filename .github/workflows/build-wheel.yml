name: Build Python Wheel

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: pip install build wheel
      
      - name: Create pyproject.toml
        run: |
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=61.0", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "melbalabs_summarize_consumes"
          version = "2025.1121.ambershire"
          description = "Turtle WoW consumables analyzer for Ambershire server"
          
          [tool.setuptools.packages.find]
          where = ["src"]
          EOF
      
      - name: Create package structure
        run: |
          mkdir -p src/melbalabs/summarize_consumes
          # Копируем все Python файлы в src/melbalabs/summarize_consumes/
          cp *.py src/melbalabs/summarize_consumes/ 2>/dev/null || true
          cp -r melbalabs/summarize_consumes/* src/melbalabs/summarize_consumes/ 2>/dev/null || true
          
          # Создаем __init__.py если нужно
          touch src/melbalabs/__init__.py
          touch src/melbalabs/summarize_consumes/__init__.py
      
      - name: Build wheel
        run: python -m build --wheel
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
