name: Build Python Wheel

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: pip install build wheel
      
      - name: Create pyproject.toml
        run: |
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=61.0", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "melbalabs_summarize_consumes"
          version = "2025.11.21"
          description = "Turtle WoW consumables analyzer for Ambershire server"
          
          [tool.setuptools.packages.find]
          where = ["src"]
          EOF
      
      - name: Create package structure
        run: |
          mkdir -p src/melbalabs/summarize_consumes
          cp *.py src/melbalabs/summarize_consumes/ 2>/dev/null || true
          cp -r melbalabs/summarize_consumes/* src/melbalabs/summarize_consumes/ 2>/dev/null || true
          touch src/melbalabs/__init__.py
          touch src/melbalabs/summarize_consumes/__init__.py
          cat > src/melbalabs/summarize_consumes/package.py << 'EOF'
          VERSION = "2025.11.21"
          PROJECT_NAME = "melbalabs_summarize_consumes"
          PROJECT_URL = "https://github.com/whtmst/summarize_consumes"
          EOF
      
      - name: Build wheel
        run: python -m build --wheel
      
      - name: Upload wheel to web folder
        run: |
          mkdir -p web
          cp dist/*.whl web/                    # ← ВАЖНО: эта строка должна быть!
          echo "2025.11.21" > web/current_version.txt
          cp index.html web/ 2>/dev/null || true
          cp style.css web/ 2>/dev/null || true
          cp worker.js web/ 2>/dev/null || true
          ls -la web/                           # ← Для отладки
      
      - name: Upload wheel artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
